<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <!-- Simbol Cabang Pohon Logika 16-Bit Pixel Node Branch -->
  <g transform="translate(10, 14)">
    <!-- Batang Akar 'io' -->
    <rect x="6" y="20" width="10" height="24" rx="2" fill="#0F766E"/>
    <!-- Node Pangkal (Forest Emerald) -->
    <circle cx="11" cy="44" r="7" fill="#0F766E" stroke="#042F2E" stroke-width="2"/>
    <circle cx="11" cy="44" r="2.5" fill="#F7F5F0"/>
    
    <!-- Cabang Kiri Atas (TRUE / Forest Emerald) -->
    <path d="M 11 26 L 11 16 L 30 8" fill="none" stroke="#0F766E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="8" r="6" fill="#10B981" stroke="#0F766E" stroke-width="2"/>
    <rect x="30.5" y="6.5" width="3" height="3" fill="#FFFFFF"/>
    
    <!-- Cabang Kanan Bawah (FALSE / Warm Amber) -->
    <path d="M 11 34 L 20 44 L 32 44" fill="none" stroke="#D97706" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="34" cy="44" r="6" fill="#D97706" stroke="#92400E" stroke-width="2"/>
    <rect x="32.5" y="42.5" width="3" height="3" fill="#FFFFFF"/>
  </g>

  <!-- Teks Judul iobranch (Forest Emerald & Pixel Art Font) -->
  <text x="64" y="44" font-family="'Press Start 2P', monospace, sans-serif" font-size="22" font-weight="bold" fill="#0F766E" letter-spacing="0.5">iobranch</text>

  <!-- Subtitle Slogan Resmi (Warm Amber & Inter Font) -->
  <text x="66" y="62" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#D97706" letter-spacing="0.5">JELAJAHI LOGIKA • KUASAI PERCABANGAN</text>
</svg>