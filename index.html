  <!-- Tautan Aksesibilitas Langsung ke Konten Utama (Skip Link) -->
  <a href="#main-workspace" class="skip-link">Lewati ke Konten Utama</a>

  <div id="app">
    <!-- Header Navigasi Global (Persisten 100% di Atas) -->
    <header id="global-header"></header>

    <!-- Workspace Utama Responsif -->
    <main id="main-workspace">
      <!-- Frame Konsol Game Minimalis Modern (Kiri di Desktop/Tablet, Atas di Mobile - Default Tersembunyi Cegah FOUC) -->
      <div id="game-console-wrapper" style="display: none;">
        <div class="console-bezel-frame">
          <!-- Layar Kanvas Game Phaser 3 -->
          <div id="game-container" role="region" aria-label="Layar Visualisasi Permainan Petualangan Logika"></div>
        </div>
      </div>

      <!-- Panel Kontrol & Konten Interaktif DOM (Kanan di Desktop/Tablet, Bawah di Mobile) -->
      <div id="ui-overlay"></div>
    </main>

    <!-- Footer Banner Universal Persisten (Membentang 100% di Bawah Workspace) -->
    <footer id="global-footer"></footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
